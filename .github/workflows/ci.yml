name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public Firebase client configuration. Repository variables may override
      # these CI-safe defaults without granting access to protected secrets.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'test-firebase-api-key' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'demo-gemailla-ci.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'demo-gemailla-ci' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'demo-gemailla-ci.appspot.com' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '1234567890' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:1234567890:web:ci' }}
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY || 'ci-app-check-site-key' }}
      VERTEX_GEMINI_MODEL: gemini-3.6-flash
      GOOGLE_CLOUD_PROJECT: demo-gemailla-ci
      VERTEX_GEMINI_LOCATION: global
      VERTEX_GEMINI_INPUT_PER_1K_TOKENS_USD: '0.1'
      VERTEX_GEMINI_CACHED_INPUT_PER_1K_TOKENS_USD: '0.02'
      VERTEX_GEMINI_OUTPUT_PER_1K_TOKENS_USD: '0.4'
      VERTEX_GEMINI_REASONING_TOKEN_TREATMENT: billable
      VERTEX_GEMINI_REASONING_PER_1K_TOKENS_USD: '0.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm used by root and Functions
        run: npm install --global npm@11.4.2

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json', 'firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Pre-download Firestore emulator
        run: npx firebase-tools setup:emulators:firestore

      - name: Validate environment before build and deploy
        run: npm run validate:env:all

      - name: Install Security Scan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          command -v rg
          rg --version

      - name: Security Scan
        shell: bash
        run: |
          set -euo pipefail
          # Bloquear VITE_* sensibles que contengan ENDPOINT, URL o KEY en el cliente.
          # Las claves públicas de Firebase y App Check se permiten explícitamente.
          scan_output="$RUNNER_TEMP/vite-sensitive-scan.txt"
          if rg -n --glob '*.{js,jsx}' 'VITE_.*(ENDPOINT|URL|KEY)' src > "$scan_output"; then
            : # Se encontraron candidatos; se filtran las claves públicas permitidas.
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              echo "::error::ripgrep no pudo ejecutar el escaneo de seguridad (exit $scan_status)"
              exit "$scan_status"
            fi
          fi

          sensitive_matches=$(awk '!/VITE_FIREBASE_(API_KEY|APPCHECK_SITE_KEY)/' "$scan_output")
          if [ -n "$sensitive_matches" ]; then
            printf '%s\n' "$sensitive_matches"
            echo "ERROR: Variables VITE_* sensibles detectadas en cliente"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck core
        run: npm run typecheck:core

      - name: Firebase rules emulator tests
        run: npm run test:rules:emulators

      - name: Unit tests
        run: npm run test:unit

      - name: Functions tests
        run: npm run test:functions

      - name: Validate architecture
        run: npm run validate:architecture

      - name: Measure architecture baseline
        run: npm run measure:architecture

      - name: Validate secrets
        run: npm run validate:secrets

      - name: Build
        run: npm run build

      - name: Upload validated web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e-emulators:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm used by root and Functions
        run: npm install --global npm@11.4.2

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json', 'firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Pre-download Firestore emulator
        run: npx firebase-tools setup:emulators:firestore

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with Firebase emulators
        run: npm run test:e2e:emulators

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
